<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acoustic Space 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--fg:#d8d8d8;--dim:#8a8a8a;--line:rgba(255,255,255,.42);--danger:#ff5c5c;--font:'IBM Plex Mono',monospace;--fs:13px}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#app{width:100%;height:100%}
body{overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--fs);font-weight:400;letter-spacing:.02em;text-transform:uppercase}
button,input,label{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
.app{position:fixed;inset:0}
.canvasMount{position:absolute;inset:0}
.hud{position:absolute;z-index:4;pointer-events:none}
.top{top:18px;left:18px;display:flex;gap:18px}
.dim{color:var(--dim)}
.metrics{top:18px;right:18px;text-align:right;display:grid;gap:4px}
.metrics span:first-child{color:var(--dim);margin-right:10px}
.axes{left:18px;bottom:96px;color:var(--dim)}
.meta{right:18px;bottom:96px;text-align:right;color:var(--dim);line-height:1.5}
.bottom{left:18px;right:18px;bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:auto}
.btn{appearance:none;background:transparent;border:1px solid var(--line);border-radius:0;padding:8px 12px;min-height:36px;cursor:pointer;display:inline-flex;align-items:center;transition:border-color .14s,background .14s}
.btn:hover{border-color:#fff;background:rgba(255,255,255,.05)}
.btn.active{border-color:#fff}
.btn.rec{border-color:var(--danger);color:var(--danger)}
.btn input{display:none}
.group{display:inline-flex;gap:8px}
.slider{display:inline-flex;align-items:center;gap:8px;color:var(--dim);min-height:36px}
input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:1px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:14px;background:var(--bg);border:1px solid #fff;border-radius:0;cursor:pointer}
input[type=range]::-moz-range-thumb{width:8px;height:12px;background:var(--bg);border:1px solid #fff;border-radius:0;cursor:pointer}
.legend{display:flex;align-items:center;gap:10px;color:var(--dim)}
.bar{width:140px;height:1px;background:linear-gradient(to right,#5347ff,#2fa6ff,#36d9d6,#7dde69,#ffb22c,#ff6845)}
:focus-visible{outline:1px solid #fff;outline-offset:2px}
@media(max-width:900px){.axes,.meta{display:none}.top{flex-direction:column;gap:4px}.bottom{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script type="text/babel">
const { useEffect, useRef, useState } = React;

function App() {
  const mountRef = useRef(null);
  const analyserRef = useRef(null);
  const audioCtxRef = useRef(null);
  const destRef = useRef(null);
  const sourceRef = useRef(null);
  const recorderRef = useRef(null);
  const chunksRef = useRef([]);
  const threeRef = useRef(null);
  const autoRef = useRef(false);

  const [pitch, setPitch] = useState(0);
  const [spread, setSpread] = useState(0);
  const [volume, setVolume] = useState(0);
  const [mode, setMode] = useState("idle");
  const [trailLength, setTrailLength] = useState(700);
  const [recording, setRecording] = useState(false);
  const [autoOrbit, setAutoOrbit] = useState(false);
  const [view, setView] = useState("iso");

  useEffect(() => { autoRef.current = autoOrbit; }, [autoOrbit]);

  useEffect(() => {
    const mount = mountRef.current;
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.018);
    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(-22, 16, 34);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    mount.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(10, 10, 10);

    const BOX = 20, LIMIT = 2000;
    let maxTrail = 700, count = 0, pulse = 0;
    let camGoal = camera.position.clone(), lookGoal = controls.target.clone(), moving = false;

    const axis = (a, b, c, o) => new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a), new THREE.Vector3(...b)]),
      new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: o }));
    scene.add(axis([0,0,0],[0,BOX,0],0x8a8a8a,.55), axis([0,0,0],[BOX,0,0],0x8a8a8a,.55), axis([0,0,0],[0,0,BOX],0x8a8a8a,.55),
      axis([BOX,0,0],[BOX,BOX,0],0x393939,.3), axis([0,BOX,0],[BOX,BOX,0],0x393939,.3),
      axis([0,0,BOX],[BOX,0,BOX],0x393939,.3), axis([BOX,0,0],[BOX,0,BOX],0x393939,.3));

    const tickMat = new THREE.MeshBasicMaterial({ color: 0xe8e8e8 });
    const tg = new THREE.SphereGeometry(0.12, 8, 8);
    const xT = new THREE.Mesh(tg, tickMat), yT = new THREE.Mesh(tg, tickMat), zT = new THREE.Mesh(tg, tickMat);
    scene.add(xT, yT, zT);

    const pos = new Float32Array(LIMIT * 3), col = new Float32Array(LIMIT * 3);
    const geom = new THREE.BufferGeometry();
    geom.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geom.setAttribute("color", new THREE.BufferAttribute(col, 3));
    geom.setDrawRange(0, 0);
    scene.add(new THREE.Line(geom, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: .96 })));

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.28, 0.34, 32),
      new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: .75 }));
    scene.add(head, ring);

    function detectPitch(buf, sr) {
      let rms = 0;
      for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
      if (Math.sqrt(rms / buf.length) < 0.015) return -1;
      let best = -1, rMax = 0;
      for (let o = Math.floor(sr / 9000); o < Math.floor(sr / 800); o++) {
        let r = 0;
        for (let i = 0; i < buf.length - o; i++) r += buf[i] * buf[i + o];
        if (r > rMax) { rMax = r; best = o; }
      }
      return best > 0 ? sr / best : -1;
    }
    function spreadOf(f, sr) {
      const bw = (sr / 2) / f.length; let s = 0, c = 0;
      for (let i = 0; i < f.length; i++) { const m = Math.pow(10, f[i] / 20); s += m; c += i * bw * m; }
      if (!s) return 0;
      const cen = c / s; let v = 0;
      for (let i = 0; i < f.length; i++) { const m = Math.pow(10, f[i] / 20); v += Math.pow(i * bw - cen, 2) * m; }
      return Math.sqrt(v / s);
    }

    const tBuf = new Float32Array(2048), fBuf = new Float32Array(1024);
    let raf;
    function loop() {
      raf = requestAnimationFrame(loop);
      if (moving) {
        camera.position.lerp(camGoal, .06);
        controls.target.lerp(lookGoal, .06);
        if (camera.position.distanceTo(camGoal) < .1) moving = false;
      }
      controls.autoRotate = autoRef.current;
      controls.autoRotateSpeed = 1.4;

      const an = analyserRef.current, ctx = audioCtxRef.current;
      if (an && ctx) {
        an.getFloatTimeDomainData(tBuf);
        an.getFloatFrequencyData(fBuf);
        let sq = 0;
        for (let i = 0; i < tBuf.length; i++) sq += tBuf[i] * tBuf[i];
        const vol = Math.min(1, Math.sqrt(sq / tBuf.length) * 10);
        const p = detectPitch(tBuf, ctx.sampleRate);
        const sp = spreadOf(fBuf, ctx.sampleRate);
        setVolume(Math.round(vol * 100)); setSpread(Math.round(sp)); setPitch(p > 0 ? Math.round(p) : 0);

        if (p > 700 && vol > .04) {
          const ny = Math.min(Math.max((Math.log2(p) - Math.log2(1000)) / (Math.log2(9000) - Math.log2(1000)), 0), 1);
          const px = Math.min(sp / 2048, 1) * BOX, py = ny * BOX, pz = vol * BOX;
          xT.position.set(px, 0, 0); yT.position.set(0, py, 0); zT.position.set(0, 0, pz);
          head.position.set(px, py, pz); ring.position.set(px, py, pz); ring.lookAt(camera.position);
          const c = new THREE.Color().setHSL(.74 - ny * .67, .9, .58);
          head.material.color.copy(c); ring.material.color.copy(c);
          pulse += .15;
          const s = 1 + Math.sin(pulse) * .3 + vol * .45; ring.scale.set(s, s, s);

          if (count < maxTrail) { pos.set([px, py, pz], count * 3); count++; }
          else { pos.copyWithin(0, 3, maxTrail * 3); pos.set([px, py, pz], (maxTrail - 1) * 3); }
          for (let i = 0; i < count; i++) {
            const f = .14 + .86 * (i / Math.max(1, count - 1));
            col[i*3] = c.r * f; col[i*3+1] = c.g * f; col[i*3+2] = c.b * f;
          }
          geom.attributes.position.needsUpdate = true;
          geom.attributes.color.needsUpdate = true;
          geom.setDrawRange(0, count);
        }
      }
      controls.update();
      renderer.render(scene, camera);
    }
    loop();

    const onResize = () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    };
    addEventListener("resize", onResize);

    threeRef.current = {
      moveTo: (p, l = new THREE.Vector3(10, 10, 10)) => { camGoal.copy(p); lookGoal.copy(l); moving = true; },
      clear: () => { count = 0; geom.setDrawRange(0, 0); },
      setTrail: v => { maxTrail = v; if (count > v) count = v; },
      stream: () => renderer.domElement.captureStream(60)
    };

    return () => {
      cancelAnimationFrame(raf);
      removeEventListener("resize", onResize);
      mount.removeChild(renderer.domElement);
      renderer.dispose();
    };
  }, []);

  useEffect(() => { threeRef.current && threeRef.current.setTrail(trailLength); }, [trailLength]);

  useEffect(() => {
    if (!threeRef.current) return;
    const V = THREE.Vector3;
    const map = { iso: new V(-22,16,34), front: new V(10,10,42), side: new V(42,10,10), top: new V(10,42,10) };
    threeRef.current.moveTo(map[view]);
  }, [view]);

  async function ctxReady() {
    if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtxRef.current.state === "suspended") await audioCtxRef.current.resume();
    return audioCtxRef.current;
  }
  async function connect(node, toOutput) {
    const ctx = await ctxReady();
    if (sourceRef.current && sourceRef.current.stop) { try { sourceRef.current.stop(); } catch (e) {} }
    const an = ctx.createAnalyser();
    an.fftSize = 2048; an.smoothingTimeConstant = .25;
    const dest = ctx.createMediaStreamDestination();
    node.connect(an); node.connect(dest);
    if (toOutput) an.connect(ctx.destination);
    analyserRef.current = an; destRef.current = dest; sourceRef.current = node;
  }
  async function enableMic() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const ctx = await ctxReady();
      await connect(ctx.createMediaStreamSource(stream), false);
      setMode("mic");
    } catch (e) { setMode("error"); }
  }
  async function loadFile(file) {
    if (!file) return;
    try {
      const ctx = await ctxReady();
      const buf = await ctx.decodeAudioData(await file.arrayBuffer());
      const src = ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      await connect(src, true);
      src.start(0);
      setMode("file");
    } catch (e) { setMode("error"); }
  }
  function startRec() {
    if (!threeRef.current) return;
    const cs = threeRef.current.stream();
    let tracks = [...cs.getVideoTracks()];
    if (destRef.current) tracks = tracks.concat(destRef.current.stream.getAudioTracks());
    const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm";
    const rec = new MediaRecorder(new MediaStream(tracks), { mimeType: mime });
    chunksRef.current = [];
    rec.ondataavailable = e => e.data.size && chunksRef.current.push(e.data);
    rec.onstop = () => {
      const url = URL.createObjectURL(new Blob(chunksRef.current, { type: "video/webm" }));
      const a = document.createElement("a");
      a.href = url; a.download = "songtrail-" + Date.now() + ".webm";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 300);
    };
    rec.start(); recorderRef.current = rec; setRecording(true);
  }
  function stopRec() { recorderRef.current && recorderRef.current.stop(); setRecording(false); }

  const fade = trailLength < 300 ? "FAST" : trailLength < 1000 ? "SLOW" : "LONG";
  const vb = (id, label) => (
    <button className={"btn" + (view === id ? " active" : "")} onClick={() => setView(id)}>{label}</button>
  );

  return (
    <div className="app">
      <div ref={mountRef} className="canvasMount" />

      <div className="hud top"><span>Acoustic Space 3D</span><span className="dim">Realtime Spectral Trajectory</span></div>

      <div className="hud metrics" aria-live="polite">
        <div><span>Pitch</span><span>{pitch} Hz</span></div>
        <div><span>Spread</span><span>{spread} Hz</span></div>
        <div><span>Volume</span><span>{volume}%</span></div>
        <div><span>Input</span><span>{mode}</span></div>
      </div>

      <div className="hud axes">Y Pitch / X Spread / Z Volume</div>
      <div className="hud meta"><div>Colour = Pitch</div><div>Range 1000 Hz to 9000 Hz</div></div>

      <div className="hud bottom">
        <div className="controls">
          <button className="btn" onClick={enableMic}>{mode === "mic" ? "Mic Active" : "Mic"}</button>
          <label className="btn">Audio<input type="file" accept="audio/*" onChange={e => loadFile(e.target.files[0])} /></label>
          <div className="group">{vb("iso","Iso")}{vb("front","Front")}{vb("side","Side")}{vb("top","Top")}</div>
          <button className={"btn" + (autoOrbit ? " active" : "")} onClick={() => setAutoOrbit(v => !v)}>Auto</button>
          <div className="slider">
            <span>Fade</span>
            <input type="range" min="150" max="2000" step="50" value={trailLength} onChange={e => setTrailLength(+e.target.value)} />
            <span>{fade}</span>
          </div>
          <button className={"btn" + (recording ? " rec" : "")} onClick={recording ? stopRec : startRec}>{recording ? "Stop" : "Rec"}</button>
          <button className="btn" onClick={() => threeRef.current && threeRef.current.clear()}>Clear</button>
        </div>
        <div className="legend"><span>Pitch</span><div className="bar" /></div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
</body>
</html>
